name: Daily County Cargo Blog Publisher

on:
  # MANUAL TESTING TRIGGER:
  # Allows triggering from the GitHub Actions console with custom slot parameters
  workflow_dispatch:
    inputs:
      slot:
        description: 'Publishing Slot (1 = Morning 09:00 London, 2 = Afternoon 15:00 London, Auto = detect from London time)'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - '1'
          - '2'
      target_date:
        description: 'Target Date Override (YYYY-MM-DD) - Leave blank for today'
        required: false
        default: ''

  # CRON SCHEDULE TRIGGER (CURRENTLY DISABLED):
  # To enable automated daily publishing, uncomment the schedule block below
  # after verifying storage persistence, authentication, and duplicate prevention.
  # The 4 hours (08:00, 09:00, 14:00, 15:00 UTC) accommodate both GMT and BST
  # so articles publish exactly at 09:00 and 15:00 Europe/London year-round.
  # schedule:
  #   - cron: '0 8,9,14,15 * * *'

jobs:
  publish-article:
    name: Publish Scheduled Shipping Guide
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Runtime
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --prefer-offline

      - name: Publish Daily Article to County Cargo
        env:
          ADMIN_API_KEY: ${{ secrets.ADMIN_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SITE_URL: 'https://countycargo.com'
        run: |
          SLOT_INPUT="${{ github.event.inputs.slot }}"
          DATE_INPUT="${{ github.event.inputs.target_date }}"
          
          CMD="node scripts/daily-blog-publisher.js"
          if [ -n "$SLOT_INPUT" ] && [ "$SLOT_INPUT" != "auto" ]; then
            CMD="$CMD --slot=$SLOT_INPUT"
          fi
          if [ -n "$DATE_INPUT" ]; then
            CMD="$CMD --date=$DATE_INPUT"
          fi
          
          echo "Executing publishing command: $CMD"
          $CMD
